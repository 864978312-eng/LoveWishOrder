
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>专属心愿点单</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #fff0f5;
      color: #684253;
      font-family: Arial, "Microsoft YaHei", sans-serif;
    }
    main {
      width: 100%;
      max-width: 440px;
      padding: 32px 24px;
      background: #ffffff;
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 10px 36px rgba(190, 90, 130, 0.15);
    }
    .heart { font-size: 64px; }
    h1 { color: #d65383; font-size: 28px; }
    p { line-height: 1.9; }
    .status {
      padding: 14px;
      margin-top: 24px;
      border-radius: 14px;
      background: #fff0f5;
      color: #b44470;
    }
  </style>
</head>
<body>
  <main>
    <div class="heart">💕</div>
    <h1>专属心愿点单</h1>
    <p>把小小的心愿，变成我们一起完成的约定。</p>
    <div class="status">
      <strong>网页初始化成功！</strong>
      <p>很期待和你一起完成每一个心愿。</p>
    </div>
    <p>每一份心愿，都值得认真回应。❤️</p>
  </main>
</body>
</html>
